name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version, without v (e.g. 0.1.0)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and release target
        run: |
          [[ "$GITHUB_REF" == refs/heads/master ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release already exists"; exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: .build
          key: swift-release-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
      - run: swift test
      - name: Build universal app and CLI
        env:
          ARCHS: arm64 x86_64
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build.sh
      - run: python3 scripts/integration-test.py
      - name: Package Homebrew cask
        run: |
          python3 scripts/render-cask.py "$VERSION" build/Shelferry.zip build/shelferry.rb
          ruby -c build/shelferry.rb
          for arch in arm64 x86_64; do
            xcrun lipo build/Shelferry.app/Contents/MacOS/Shelferry -verify_arch "$arch"
            xcrun lipo build/Shelferry.app/Contents/Helpers/shelferry -verify_arch "$arch"
          done
      - name: Publish
        run: |
          cat > build/release-notes.md <<'NOTES'
          Native floating shelves, a standalone CLI, and a Yazi plugin.

          Install: `brew install --cask tahsinature/tap/shelferry`
          Yazi: `ya pkg add tahsinature/shelferry:shelferry`

          Requires macOS 14+. Universal Apple Silicon and Intel build.
          This release is ad-hoc signed and is not Apple-notarized. macOS may require approval in Privacy & Security.
          Shelferry uses separate storage; it does not migrate or modify Tooki shelves.
          NOTES
          gh release create "v$VERSION" build/Shelferry.zip build/Shelferry.zip.sha256 build/shelferry.rb --target "$GITHUB_SHA" --title "Shelferry $VERSION" --notes-file build/release-notes.md
